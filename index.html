<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PART5 차동기어</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap">
<h1>차동기어 (Differential Gear)</h1>
<div class="badges"><span>시험 ★★★★★</span><span>실무 ★★★★★</span><span>난이도 ★★★☆☆</span></div>

<section class="card">
<h2>30초 핵심정리</h2>
<ul>
<li>좌·우 바퀴의 회전속도를 다르게 하는 장치</li>
<li>직진 시 좌우 동일 회전</li>
<li>선회 시 바깥쪽 바퀴가 더 빠르게 회전</li>
</ul>
</section>

<section class="card">
<h2>작동원리</h2>
<div class="road">
<div id="wl" class="wheel"></div>
<div class="diff"></div>
<div id="wr" class="wheel"></div>
</div>
<button onclick="mode('straight')">직진</button>
<button onclick="mode('left')">좌회전</button>
<button onclick="mode('right')">우회전</button>
<p id="desc"></p>
</section>

<section class="card">
<h2>실무 · 시험 POINT</h2>
<h3>실무</h3>
<ul>
<li>회전 소음 → 차동기어·베어링 점검</li>
<li>오일 누유 → 오일실·케이스 확인</li>
<li>후륜 충격 → 링기어·피니언 손상 확인</li>
</ul>

<h3>시험</h3>
<ul>
<li>차동기어의 목적</li>
<li>직진과 선회 시 회전 차이</li>
<li>사이드기어·피니언기어 역할</li>
</ul>
</section>
</div>
<script src="script.js"></script></body></html>
